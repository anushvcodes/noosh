<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NOOSH — talk, and it types</title>
<meta name="description" content="NOOSH Web — hold to talk and your words appear as text, right in your browser." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0c10'/%3E%3Ctext x='32' y='45' font-family='Helvetica,Arial' font-size='40' font-weight='800' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg1:#0b0c10; --bg2:#020204; --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.10); --ink:#f2f4f8; --dim:#9aa3b2;
    --mint:#7deec7; --mint-dim:#4fd6a8; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%,#14161d 0%,var(--bg1) 45%,var(--bg2) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 18px; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:720px}
  header{display:flex; align-items:center; gap:14px; margin-bottom:22px}
  .logo{
    width:54px; height:54px; border-radius:15px; flex:none;
    background:linear-gradient(160deg,#1a1d25,#070709);
    border:1px solid var(--line);
    display:grid; place-items:center;
    font-weight:800; font-size:28px; letter-spacing:-1px;
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  h1{margin:0; font-size:26px; letter-spacing:-.4px}
  h1 small{display:block; font-weight:400; font-size:13.5px; color:var(--dim); letter-spacing:0; margin-top:3px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:22px;
    padding:22px; backdrop-filter:blur(12px);
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .mic{
    width:74px; height:74px; border-radius:50%; border:none; cursor:pointer; flex:none;
    background:linear-gradient(180deg,var(--mint),var(--mint-dim));
    color:#04231a; display:grid; place-items:center;
    box-shadow:0 12px 30px rgba(79,214,168,.30);
    transition:transform .08s ease, box-shadow .15s ease, filter .15s ease;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .mic svg{width:32px; height:32px}
  .mic:active,.mic.on{transform:scale(.95); filter:saturate(1.1)}
  .mic.on{box-shadow:0 0 0 0 rgba(125,238,199,.55); animation:pulse 1.6s infinite}
  .mic[disabled]{opacity:.4; cursor:not-allowed; filter:grayscale(.6)}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(125,238,199,.45)}
    70%{box-shadow:0 0 0 22px rgba(125,238,199,0)}
    100%{box-shadow:0 0 0 0 rgba(125,238,199,0)}
  }
  .status{font-size:15px; font-weight:600}
  .status .sub{display:block; font-weight:400; color:var(--dim); font-size:12.5px; margin-top:2px}
  .hint{color:var(--dim); font-size:12.5px; margin-left:auto}
  kbd{
    background:rgba(255,255,255,.09); border:1px solid var(--line); border-bottom-width:2px;
    border-radius:6px; padding:1px 6px; font-size:11.5px; font-family:inherit;
  }
  #out{
    margin-top:18px; min-height:170px; max-height:44vh; overflow:auto; white-space:pre-wrap;
    background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px;
    padding:16px; font-size:17px; line-height:1.6;
  }
  #out:empty::before{content:attr(data-ph); color:#5c6675}
  .toolbar{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
  button.btn{
    background:rgba(255,255,255,.06); color:var(--ink); border:1px solid var(--line);
    border-radius:11px; padding:9px 14px; font-size:13.5px; cursor:pointer; font-weight:600;
    transition:background .15s ease, border-color .15s ease;
  }
  button.btn:hover{background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.2)}
  button.btn:disabled{opacity:.4; cursor:not-allowed}
  select{
    background:rgba(255,255,255,.06); color:var(--ink); border:1px solid var(--line);
    border-radius:11px; padding:9px 12px; font-size:13.5px; font-family:inherit;
  }
  .foot{margin-top:16px; color:var(--dim); font-size:12.5px; line-height:1.7}
  .warn{
    display:none; margin-top:14px; padding:12px 14px; border-radius:12px;
    background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35); color:#ffd0d0; font-size:13.5px;
  }
  a{color:var(--mint)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">N</div>
    <h1>NOOSH <small>Hold to talk — your words appear as text.</small></h1>
  </header>

  <div class="card">
    <div class="row">
      <button class="mic" id="mic" title="Hold to dictate" aria-label="Hold to dictate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <div class="status" id="status">Ready
        <span class="sub" id="sub">Hold the mic, or hold the <kbd>Space</kbd> bar, and speak.</span>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="warn" id="warn"></div>

    <div id="out" data-ph="Your words will appear here…"></div>

    <div class="toolbar">
      <button class="btn" id="copy">Copy</button>
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="save">Save as .txt</button>
      <select id="lang" title="Language">
        <option value="en-GB" selected>English (UK)</option>
        <option value="en-US">English (US)</option>
        <option value="en-IN">English (India)</option>
        <option value="ur-PK">اردو (Urdu)</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="ar-SA">العربية (Arabic)</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
      </select>
    </div>

    <div class="foot">
      Works best in <strong>Chrome</strong>, <strong>Edge</strong> or <strong>Safari</strong>. Speech is processed by your browser.
      <br>Want the real thing — hold <kbd>⌥ Option</kbd> and dictate into <em>any</em> app? That's the macOS app.
    </div>
  </div>
</div>

<script>
(function(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('mic');
  const statusEl = document.getElementById('status');
  const subEl = document.getElementById('sub');
  const out = document.getElementById('out');
  const warn = document.getElementById('warn');
  const copyBtn = document.getElementById('copy');
  const clearBtn = document.getElementById('clear');
  const saveBtn = document.getElementById('save');
  const langSel = document.getElementById('lang');
  const hint = document.getElementById('hint');

  let rec = null, listening = false, holdMode = true, finalText = '';

  if(!SR){
    mic.disabled = true;
    warn.style.display = 'block';
    warn.textContent = 'This browser does not support speech recognition. Please open this page in Chrome, Edge or Safari.';
    statusEl.firstChild.textContent = 'Not supported';
    return;
  }

  function build(){
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = langSel.value;
    rec.onstart = () => setListening(true);
    rec.onend = () => {
      if(listening && holdMode){ /* stopped by release */ }
      setListening(false);
    };
    rec.onerror = (e) => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        warn.style.display = 'block';
        warn.textContent = 'Microphone permission was blocked. Allow microphone access for this site, then try again.';
      } else if(e.error === 'no-speech'){
        // ignore, we just restart
      }
      setListening(false);
    };
    rec.onresult = (e) => {
      let interim = '';
      for(let i=e.resultIndex; i<e.results.length; i++){
        const t = e.results[i][0].transcript;
        if(e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      render(interim);
    };
  }

  function render(interim){
    const text = (finalText + (interim ? interim : '')).replace(/^\s+/,'');
    out.textContent = text;
    out.scrollTop = out.scrollHeight;
  }

  function setListening(on){
    listening = on;
    mic.classList.toggle('on', on);
    statusEl.firstChild.textContent = on ? 'Listening…' : 'Ready';
    subEl.textContent = on ? 'Release to stop.' : 'Hold the mic, or hold the Space bar, and speak.';
  }

  function start(){
    if(listening) return;
    finalText = out.textContent === out.getAttribute('data-ph') ? '' : out.textContent;
    warn.style.display='none';
    try{ rec.start(); setListening(true); }catch(_){}
  }
  function stop(){
    if(!rec) return;
    try{ rec.stop(); }catch(_){}
    setListening(false);
  }

  build();
  langSel.addEventListener('change', () => { const was = listening; stop(); build(); if(was) setTimeout(start, 200); });

  // Hold the mic button
  mic.addEventListener('pointerdown', (e)=>{ e.preventDefault(); holdMode = true; start(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    mic.addEventListener(ev, ()=>{ if(holdMode) stop(); })
  );

  // Hold the space bar (when not typing in the output)
  let spaceHeld = false;
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' && !e.repeat && document.activeElement !== out){
      e.preventDefault(); if(!spaceHeld){ spaceHeld = true; holdMode = true; start(); }
    }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code === 'Space'){ e.preventDefault(); spaceHeld = false; stop(); }
  });

  copyBtn.addEventListener('click', async ()=>{
    const t = out.textContent.trim();
    if(!t) return;
    try{ await navigator.clipboard.writeText(t); flash(copyBtn,'Copied ✓'); }
    catch(_){ flash(copyBtn,'Press ⌘C'); }
  });
  clearBtn.addEventListener('click', ()=>{ finalText=''; out.textContent=''; });
  saveBtn.addEventListener('click', ()=>{
    const t = out.textContent.trim(); if(!t) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([t], {type:'text/plain'}));
    a.download = 'noosh.txt'; a.click(); URL.revokeObjectURL(a.href);
  });
  function flash(btn, msg){ const old = btn.textContent; btn.textContent = msg; setTimeout(()=>btn.textContent = old, 1200); }

  // Browser hint
  hint.textContent = /Firefox/i.test(navigator.userAgent) ? 'Firefox not supported' : '';
})();
</script>
</body>
</html>
